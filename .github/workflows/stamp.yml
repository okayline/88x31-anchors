name: Hourly ledger receipt

on:
  schedule:
    - cron: "17 * * * *"   # every hour, at 17 past
  workflow_dispatch:        # "Run workflow" button for a receipt right now

permissions:
  contents: write

concurrency:
  group: stamp
  cancel-in-progress: false

jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OpenTimestamps
        run: pip install opentimestamps-client

      - name: Stamp the ledger head
        run: python stamp.py

      - name: Commit new receipts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new."
          else
            git commit -m "Receipt $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
